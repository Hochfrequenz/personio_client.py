# This GitHub workflow publishes the package on PyPI when a GitHub release with a tag "v*" (e.g. v0.1.0) is published.
# It uses trusted publishing (https://docs.pypi.org/trusted-publishers/), which needs:
# - the GitHub environment "release" in the repository settings (if its deployment branches are restricted,
#   add a rule of type tag matching "v*", because a release deploys from the tag, not from a branch)
# - a trusted publisher on PyPI for the project "personio-client": owner "Hochfrequenz", repository "personio_client.py",
#   workflow "python-publish.yml", environment "release"
# The version comes from the git tag (hatch-vcs).

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Run the checks
        run: |
          uv run --group tests pytest
          uv run --group linting ruff check src/personio_client unittests scripts
          uv run --group type_check mypy --show-error-codes src/personio_client --strict
          uv run --group type_check mypy --show-error-codes unittests --strict
          uv run --group type_check mypy --show-error-codes scripts --strict

  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    # the GitHub environment, which PyPI strongly recommends for trusted publishing
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    needs: tests
    steps:
      - uses: actions/checkout@v7
        with:
          # the full history including the tags, from which hatch-vcs takes the version
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
      - name: Build wheel and source distributions
        run: uv build
      - name: Publish distribution 📦 to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish --trusted-publishing=always
