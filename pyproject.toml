[project]
name = "personio_client"
description = "An async Python client for the Personio API v2 (persons and employments)"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["personio", "hr", "api", "client", "async", "aiohttp", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.10,<3.14",
    "pydantic>=2.7",
]
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/personio_client.py/releases"
Homepage = "https://github.com/Hochfrequenz/personio_client.py"

[dependency-groups]
tests = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "aioresponses==0.7.9"]
linting = [{ include-group = "tests" }, "ruff==0.16.9"]
type_check = [{ include-group = "tests" }, "mypy==2.3.1"]
spell_check = ["codespell==2.4.3"]
coverage = [{ include-group = "tests" }, "coverage==7.16.1"]
# datamodel-code-generator regenerates the models from the OpenAPI specs of Personio
codegen = [{ include-group = "linting" }, "datamodel-code-generator==0.71.0"]
# build/twine are only needed to build & publish this package to PyPI, not by users installing it, so they live
# here rather than as a pip-installable extra.
packaging = ["build==1.6.1", "twine==7.0.0"]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" },
    { include-group = "codegen" },
    "pre-commit",
]

[tool.uv]
# don't auto-include the "dev" group in every `uv sync`/`uv run` invocation, so that CI jobs can pull in just the
# one group they need (e.g. `uv run --group linting ...`) without also installing every other tool.
default-groups = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
]

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_personio_client_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
